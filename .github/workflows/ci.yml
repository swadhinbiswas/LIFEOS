name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ADR-027: CI runs credential-less — file DB, in-memory rate-limit cache, file outbox,
      # hidden OAuth. Generate the one required secret per run; never commit one.
      - name: typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: file:.data/lifeos.db
          BETTER_AUTH_SECRET: ci-only-secret-not-a-real-credential
      - name: lint
        run: pnpm lint
      - name: format
        run: pnpm format:check
      # §10: dependency audit. Fails on high/critical; the one known moderate is tracked in
      # docs/SECURITY.md (dev-only esbuild via drizzle-kit).
      - name: audit
        run: pnpm audit --audit-level high
      - name: test
        run: pnpm test
        env:
          DATABASE_URL: file:.data/lifeos.db
          BETTER_AUTH_SECRET: ci-only-secret-not-a-real-credential
      - name: build
        run: pnpm build
        env:
          DATABASE_URL: file:.data/lifeos.db
          BETTER_AUTH_SECRET: ci-only-secret-not-a-real-credential

  e2e:
    name: playwright (axe + auth + theme)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ADR-029: the harness starts `pnpm build && pnpm start` itself against
      # tests/e2e/.e2e.db (migrated in global-setup) and reads the file outbox.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          BETTER_AUTH_SECRET: ci-only-secret-not-a-real-credential
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
